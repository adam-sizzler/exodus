name: Build & Push Release Docker Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for Docker image and Release (e.g. v1.0.0)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/exodus
  GHCR_IMAGE: ghcr.io/adam-sizzler/exodus

jobs:
  send-tg-msg:
    name: Send Telegram message (Start)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@main
        if: env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: info
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Exodus build started.'

  build-docker-images:
    name: Build ${{ matrix.platform }}
    needs: [send-tg-msg]
    if: always() && !cancelled()
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # - platform: linux/arm64
          #   runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN_GH_DEPLOY }}

      - name: Prepare build metadata
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "frontend_commit=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            __EX_METADATA_GIT_BRANCH=main
            __EX_METADATA_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            __EX_METADATA_BUILD_NUMBER=${{ github.run_number }}
            __EX_METADATA_VERSION=${{ steps.meta.outputs.version }}
            __EX_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __EX_METADATA_GIT_FRONTEND_COMMIT=${{ steps.meta.outputs.frontend_commit }}
          outputs: |
            type=image,"name=${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & push manifests
    needs: [build-docker-images]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN_GH_DEPLOY }}

      - name: Prepare version tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          MAJOR_VERSION="${VERSION%%.*}"
          if [[ "${MAJOR_VERSION}" =~ ^v[0-9]+$ ]]; then
            MAJOR_TAG="${MAJOR_VERSION#v}"
          else
            MAJOR_TAG=""
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major_tag=${MAJOR_TAG}" >> $GITHUB_OUTPUT

      - name: Create & push manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAG_ARGS=("-t" "${{ env.GHCR_IMAGE }}:latest" "-t" "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.version }}")
          if [ -n "${{ steps.tags.outputs.major_tag }}" ]; then
            TAG_ARGS+=("-t" "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.major_tag }}")
          fi

          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.version }}

  create-release:
    name: Create GitHub Release
    needs: [merge]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Prepare release tag & changelog
        id: release_meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          git fetch --tags --force || true
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude="*.n*" --exclude="*.s*" "${TAG}^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' | grep -v "^${TAG}$" | head -n 1 || true)
          fi
          echo "Current tag: ${TAG}"
          echo "Previous tag: ${PREV_TAG}"
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(npx -y changelogen@latest --no-contributors --from="$PREV_TAG" --to="$TAG" | sed '/^\[log\]/d')
          else
            CHANGELOG=$(npx -y changelogen@latest --no-contributors | sed '/^\[log\]/d')
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GH_DEPLOY }}
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: false
          append_body: false
          make_latest: true
          draft: false
          prerelease: false
          body: |
            🚀 Exodus ${{ steps.release_meta.outputs.tag }}

            ${{ env.CHANGELOG }}

            Latest Docker image:
            - `${{ env.GHCR_IMAGE }}:latest`

            Docker images:
            - `${{ env.GHCR_IMAGE }}:${{ steps.release_meta.outputs.tag }}`

  send-finish-tg-msg:
    name: Send Telegram message (Finish)
    needs: [merge, create-release]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@main
        if: env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: success
          notify_fields: 'repository,branch,commit'
          title: 'Exodus build finished.'

  notify-on-error:
    runs-on: ubuntu-latest
    needs: [build-docker-images, merge, create-release]
    if: failure()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Send error notification
        uses: proDreams/actions-telegram-notifier@main
        if: env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: failure
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Exodus build failed.'

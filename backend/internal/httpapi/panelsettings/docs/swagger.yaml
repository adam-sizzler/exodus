info:
  contact: {}
  description: Exodus dashboard and node-management API.
  license:
    name: AGPL-3.0
  title: Exodus API
  version: 3.0.0
paths:
  /auth/bootstrap:
    get:
      description: Get initial branding, password settings and whether an admin is
        configured
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.BootstrapResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Get auth bootstrap data
      tags:
      - Auth Controller
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate admin with username and password
      parameters:
      - description: Admin login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Admin login
      tags:
      - Auth Controller
  /auth/logout:
    post:
      description: Clear admin session cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout admin
      tags:
      - Auth Controller
  /auth/me:
    get:
      description: Get authenticated admin user profile and settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current session
      tags:
      - Auth Controller
  /auth/oauth2/authorize:
    post:
      consumes:
      - application/json
      description: Get authorization URL for third-party OAuth2 provider
      parameters:
      - description: OAuth2 provider
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.oauthAuthorizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Authorize OAuth2
      tags:
      - Auth Controller
  /auth/passkey/authentication/options:
    get:
      description: Generate WebAuthn login assertion options
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Passkey authentication options
      tags:
      - Passkeys Controller
  /auth/passkey/authentication/verify:
    post:
      consumes:
      - application/json
      description: Complete WebAuthn login assertion and receive admin JWT
      parameters:
      - description: WebAuthn assertion response
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Verify passkey authentication
      tags:
      - Passkeys Controller
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register initial admin account when none exists
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Register admin
      tags:
      - Auth Controller
  /auth/setup:
    post:
      consumes:
      - application/json
      description: Set up first admin account
      parameters:
      - description: Admin setup payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.SetupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Setup admin
      tags:
      - Auth Controller
  /auth/status:
    get:
      description: Get enabled status for password, passkey and OAuth2 authentication
        methods
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/shared.ErrorResponse'
      summary: Get auth methods status
